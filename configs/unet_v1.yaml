# unet_v1: U-Net student on cleaned pseudo-labels from the label-free ridge teacher.
# GT frames (data/real/OneDrive_1_7-17-2026) are EVALUATION ONLY: nothing below
# may be chosen by looking at GT numbers.
run_name: unet_v1
seed: 0

paths:
  raw_dir: data/real/NanowireImages2
  out_root: results/unet_v1

frames:
  scale_band: [0.625, 1.0]      # ridge_nanowire_images2.VALIDATED_BAND (50k-80k effective)
  exclude: ["4010×"]            # 12.5x-upscale outlier
  max_upscale: 2.0              # hard guard: never upsample a frame by more than 2x
  exclude_from_training: []     # pseudo-labels still written, frame flagged train_excluded

pseudo_labels:
  # Teacher = the implemented production ridge filter: labelfree.labelfree_mask
  # (sato + per-frame Otsu + directional closing at image-estimated angles).
  teacher: lf_otsu
  # Step 1. No probability map exists for this teacher, so confidence is the
  # sato response resp (labelfree.sato_response, min-max normalised) relative to
  # the frame's own Otsu threshold thr. Fixed from pseudo-label overlays only,
  # never from GT coverage:
  #   core = resp > hi_mult*thr  (hi_mult 1.0 = the teacher's pre-closing mask)
  #   px within band_px of the core boundary, either side       -> ignore
  #   rest of core (core eroded by band_px)                     -> wire
  #   resp <= lo_mult*thr, outside teacher mask and band        -> background
  #   otherwise (closing-added px, lo..hi halo)                 -> ignore
  confidence: {enabled: true, lo_mult: 0.5, hi_mult: 1.0, band_px: 1}
  # Step 2. fill holes inside wire components only if narrow (max EDT of the hole
  # <= max_hole_halfwidth_px) AND dark (hole mean < median of its bbox padded by
  # local_window_px/2) -- bright debris interiors stay unfilled
  hole_fill: {enabled: true, max_hole_halfwidth_px: 4, local_window_px: 64}
  # Step 3. whole teacher components (+ step-2 fills) with major/minor < max_axis_ratio
  # AND area < max_area -> background.
  # 220 px ~ area of a disk 3 nominal wire widths across (30 nm / 5.4 nm/px = 5.6 px)
  particles: {enabled: true, max_axis_ratio: 3.0, max_particle_area_px: 220}
  # Extra. teacher components within touch_px of a saturated bright blob
  # (gray >= level on the per-frame min-max [0,255] image, >= min_blob_px px) -> ignore
  saturated: {enabled: true, level: 250, min_blob_px: 4, touch_px: 3}
  # Extra. large dark regions (charging bands): gaussian(sigma_px) gray < dark_frac x
  # frame median, area >= min_area_frac of the frame; px within margin_px of the
  # region boundary (either side) -> ignore
  dark_region: {enabled: true, sigma_px: 8, dark_frac: 0.5, min_area_frac: 0.01, margin_px: 8}
  # Step 4. wire_extract graph (its default params) on the teacher mask + step-2
  # fills, restricted to components still holding confident wire after step 3
  # (the confident core alone is cut at every crossing). Wire px of chains
  # carrying any fail flag -> ignore. The teacher mask is already
  # direction-closed, so wire_extract's own closing stays off, as in production.
  # fail_flags is EMPTY by default (v1b): wire_extract's curvature QC flags
  # straight wires that END at a junction (terminal-junction hook, see
  # results/unet_v1/README.md); it failed ~50% of chains in v1.
  qc_chains:
    enabled: true
    fail_flags: []
    graph_junction_close: false
  # Step 5. all px within radius of a degree>=3 graph node -> ignore.
  # radius_px: "auto" = radius_width_mult x the frame's median wire width (px)
  junction_band: {enabled: true, radius_px: auto, radius_width_mult: 2.0}
  ignore_flag_frac: 0.40        # report-only: flag frames above this ignore fraction
